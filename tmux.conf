##############################
#   configure Tmux Plugins   #
##############################

set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.local/share/tmux/plugins/'

if 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/tpm"' {
  run 'mkdir -p "${TMUX_PLUGIN_MANAGER_PATH}"'
  run 'git clone https://github.com/tmux-plugins/tpm "${TMUX_PLUGIN_MANAGER_PATH}/tpm"'
  run '${TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'
}

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'alexwforsythe/tmux-which-key'  # prefix + space

##############################
#    configure Tmux Theme    #
##############################

# Choose darkest theme
set -g @catppuccin_flavor 'mocha'

# Set the line's color
set -g @catppuccin_status_background "#{E:@thm_crust}"

# Status settings
set -g status-position bottom
set -g status-interval 5

# Status left (prefix indicator) settings
set -g status-left-length 100
set -g status-left '#[bg=#1F2329]#{E:@catppuccin_status_session} '

# General window settings
set -g @catppuccin_window_default_text ' #W '
set -g @catppuccin_window_status 'no'
set -gF window-status-separator ""
set -g @catppuccin_window_number_position 'left'

# Inactive windows settings
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_middle_separator ""
set -g @catppuccin_window_right_separator "#[bg=#{@thm_crust},fg=#{@thm_surface_1}]"
set -g @catppuccin_window_number " #I #[bg=#{@thm_surface_1},fg=#{@thm_overlay_2}]"
set -g @catppuccin_window_text ' #W '
set -g @catppuccin_window_text_color "#{@thm_surface_1}"

# Active window settings
set -g @catppuccin_window_current_status_style "custom"
set -g @catppuccin_window_current_left_separator ""
set -g @catppuccin_window_current_middle_separator ""
set -g @catppuccin_window_current_right_separator "#[bg=#{@thm_crust},fg=#{@thm_overlay_0}]"
set -g @catppuccin_window_current_number " #I #[bg=#{@thm_overlay_0},fg=#{@thm_green}]"
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_window_current_text ' #W '
set -g @catppuccin_window_current_number_color "#{@thm_green}"
set -g @catppuccin_window_current_text_color "#{@thm_overlay_0}"

# Set status bar (right)
set -g @catppuccin_status_module_text_bg '#{E:@thm_crust}'
set -gq '@cpu_low_bg_color' '#{E:@thm_green}'
set -gq '@cpu_medium_bg_color' '#{E:@thm_yellow}'
set -gq '@cpu_high_bg_color' '#{E:@thm_red}'
set -gq "@catppuccin_ctp_cpu_icon" ' '
set -gq "@catppuccin_ctp_cpu_color" '#{l:#{cpu_bg_color}}'
set -gq "@catppuccin_ctp_cpu_text" '#{l:#{cpu_percentage}}'
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_crust}]},#{#[bg=#{@thm_crust},fg=#{@thm_yellow}]}} #{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=#{@thm_crust},fg=#{@thm_crust}, none]│"
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_crust}]},#{#[bg=#{@thm_crust},fg=#{@thm_sky}]}}   #{cpu_percentage} "
set -ga status-right "#[bg=#{@thm_crust},fg=#{@thm_crust}, none]│"
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_crust}]},#{#[bg=#{@thm_crust},fg=#{@thm_pink}]}}   #{ram_percentage} "
set -ga status-right "#[bg=#{@thm_crust},fg=#{@thm_crust}, none]│"
set -ga status-right "#[bg=#{@thm_crust},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M"
set -ga status-right "#[bg=#1F2329,fg=#{@thm_crust}]"

# Run Catppuccin
source -F '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/utils/status_module.conf'
run '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/catppuccin.tmux'

# initialize tmux plugin manager and source all plugins
run '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'

##############################
#      General settings      #
##############################

# start index at 1
set -g base-index 1
set -g pane-base-index 1

# renumber when window is closed
set -g renumber-window on

# enable 256-colors
set -g default-terminal 'tmux-256color'
set -ag terminal-overrides ',xterm-256color*:RGB'

# set naming
setw -g automatic-rename off
set-window-option -g automatic-rename off
set-option -g allow-rename off

# disable escape sleep
set -sg escape-time 0

set -g focus-events on

set -g history-limit 100000

##############################
#        Key Bindings        #
##############################

# vim tmux integration
is_vim="ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^XZT ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n M-h if-shell "$is_vim" "send-keys M-h"  "select-pane -L"
bind-key -n M-j if-shell "$is_vim" "send-keys M-j"  "select-pane -D"
bind-key -n M-k if-shell "$is_vim" "send-keys M-k"  "select-pane -U"
bind-key -n M-l if-shell "$is_vim" "send-keys M-l"  "select-pane -R"
bind-key -n M-\\ if-shell "$is_vim" "send-keys M-\\" "select-pane -l"

# Move while in copy mode
bind-key -T copy-mode-vi M-h select-pane -L
bind-key -T copy-mode-vi M-j select-pane -D
bind-key -T copy-mode-vi M-k select-pane -U
bind-key -T copy-mode-vi M-l select-pane -R
bind-key -T copy-mode-vi M-\\ select-pane -l

# Select windows
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

bind-key -n M-d resize-pane -Z

# windows navigating
bind-key -n C-M-l next-window
bind-key -n C-M-h previous-window

# resize pane
bind-key -n     C-S-Up              resize-pane -U
bind-key -n     C-S-Down            resize-pane -D
bind-key -n     C-S-Left            resize-pane -L
bind-key -n     C-S-Right           resize-pane -R

# set vim-like keys
setw -g mode-keys vi
set-window-option -g xterm-keys on
set-window-option -g mode-keys vi
set-option -g status-keys vi

# Create windows and panes from current directory
bind-key -n C-M-c new-window -c "#{pane_current_path}"
bind-key -n M-v split-window -h -c "#{pane_current_path}"
bind-key -n M-s split-window -v -c "#{pane_current_path}"

# Copy mode keybindings
bind-key -n M-x copy-mode
bind-key -n M-p paste-buffer
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'c' send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
